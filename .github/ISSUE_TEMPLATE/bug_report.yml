name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a dashboard\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 130
    validations:
      required: true
  - type: dropdown
    id: instance
    attributes:
      label: Instance
      options:
        - Official instance
        - Self-hosted
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the footer of the home page.
    validations:
      required: false
