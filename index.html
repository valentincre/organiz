<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free attendance tracker: record who attended each date, browse by calendar or by person, share by link." />
    <meta name="theme-color" content="#3b5bdb" />
    <title>Organiz</title>
    <script>
      // "/" without a dashboard link opens the home page in the saved or browser language.
      if (location.pathname === '/' && /^#?\/?$/.test(location.hash)) {
        let lang
        try {
          lang = localStorage.getItem('organiz.lang')
        } catch {}
        if (lang !== 'fr' && lang !== 'en') lang = /^fr/i.test(navigator.language) ? 'fr' : 'en'
        location.replace('/' + lang + '/')
      }
    </script>
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        const theme = localStorage.getItem('organiz.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p><a href="/en/">Organiz — free online attendance tracker</a></p>
      <p><a href="/fr/">Organiz — feuille de présence gratuite en ligne</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
